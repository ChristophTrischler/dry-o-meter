[package]
edition      = "2024"
name         = "controller-esp32c6"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "controller-esp32c6"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c6", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
heapless = "0.9.3"

edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = [
  "proto-ipv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dhcpv4",
] }
edge-dhcp = { version = "0.8.0", default-features = false, features = ["io"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
esp-println = { version = "0.17.0", features = ["log-04", "esp32c6"] }
log = "0.4.34"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
