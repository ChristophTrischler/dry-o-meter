[package]
name = "backend"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
readme = "./README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
jsonwebtoken = { version = "10"}
rust-embed = "8"
salvo = {version = "0.94.0", features = ["anyhow", "cookie", "cors", "jwt-auth", "oapi", "serve-static", "rustls", "logging", "test"]}
serde = "1"
thiserror = "2"
tokio = {version = "1", features = ["full"]}
tracing = "0.1"
validator = {version = "0.20", features = ["derive"]}
ulid = "1"
argon2 = "0.5"
cookie = "0.18"
dotenvy = "0.15"
tracing-appender ="0.2"
tracing-subscriber = {version = "0.3", features = ["std", "fmt", "env-filter", "tracing-log", "time", "local-time", "json"]}
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "postgres", "uuid", "rust_decimal", "chrono"]}
rand = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = { version = "1", features = ["serde"] }
